# ==============================================================================
# Zenith TMUX Configuration (with Auto-Session Restore across Reboots)
# ==============================================================================

# Enable mouse mode (click windows, resize panes, scroll)
set -g mouse on

# Set default terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Start window and pane numbering at 1 (more ergonomic)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive pane splitting (opens in current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Zenith Dark Status Bar Styling
set -g status-style "bg=#090A0F,fg=#EAEAEA"
set -g status-left "#[fg=#E11D48,bold] #S #[default] "
set -g status-right "#[fg=#38BDF8]%H:%M #[fg=#10B981]%d-%b-%y "
setw -g window-status-current-style "fg=#10B981,bold,bg=#181820"

# ------------------------------------------------------------------------------
# Plugins (via TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore session on tmux start / system reboot
set -g @continuum-restore 'on'

# Auto-save session every 15 minutes
set -g @continuum-save-interval '15'

# Restore pane contents & shell history
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
