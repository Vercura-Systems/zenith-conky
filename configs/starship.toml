# Zenith Theme for Starship
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$cmd_duration\
$line_break\
$character"""

# Timeout for commands (ms)
command_timeout = 800

[character]
success_symbol = "[❯](bold #10B981)" # Emerald
error_symbol = "[❯](bold #E11D48)"   # Carmine Accent

[directory]
style = "bold #38BDF8"              # Cyan
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold #EAEAEA"

[git_status]
style = "bold #E11D48"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[nodejs]
symbol = "⬢ "
style = "bold #10B981"
format = "[$symbol($version )]($style)"

[python]
symbol = "🐍 "
style = "bold #F59E0B"
format = "[$symbol($version )]($style)"

[rust]
symbol = "🦀 "
style = "bold #E11D48"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2_000
style = "bold #8E8E98"
format = "[$duration]($style) "
