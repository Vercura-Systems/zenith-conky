-- Zenith Conky - Minimalist Developer HUD for Linux Desktops
-- GitHub: https://github.com/odesigo/zenith-conky
-- License: MIT

conky.config = {
    -- Positioning & Geometry
    alignment = 'top_left',
    gap_x = 45,
    gap_y = 50,
    minimum_width = 320,
    maximum_width = 340,

    -- Window specifications (Optimized for GNOME Wayland & X11)
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 175,
    own_window_colour = '#090A0F',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Graphics & Performance
    background = false,
    double_buffer = true,
    no_buffers = true,
    update_interval = 1.5,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    show_graph_range = false,
    show_graph_scale = false,

    -- Typography
    use_xft = true,
    font = 'Ubuntu Sans Mono:size=9.5',
    uppercase = false,
    use_spacer = 'none',
    extra_newline = false,

    -- Color Palette
    default_color = '#EAEAEA',
    color0 = '#E11D48', -- Carmine / African Coral Accent
    color1 = '#FFFFFF', -- Crisp White
    color2 = '#8E8E98', -- Muted Slate
    color3 = '#3A3A42', -- Separator Rule
    color4 = '#10B981', -- Emerald Green
    color5 = '#38BDF8', -- Sky Cyan
}

conky.text = [[
${color0}${font Ubuntu Sans:weight=bold:size=11}ZENITH ${color2}${font Ubuntu Sans:size=9}// SYSTEM TELEMETRY
${color3}${hr 1}
${voffset 2}${color2}HOST${goto 85}${color1}${nodename} ${color2}(${sysname} 24.04)
${color2}KERNEL${goto 85}${color1}${kernel}
${color2}UPTIME${goto 85}${color1}${uptime}

${voffset 4}${color0}${font Ubuntu Sans:weight=bold:size=9}PROCESSOR${font}
${color3}${hr 1}
${voffset 2}${color2}LOAD${goto 85}${color1}${cpu cpu0}%${goto 140}${color0}${cpubar 5,180}
${color2}FREQ${goto 85}${color1}${freq_g} GHz${goto 200}${color2}PROCS: ${color1}${processes}
${voffset 2}${color0}${cpugraph 20,320 25252D E11D48}

${voffset 4}${color0}${font Ubuntu Sans:weight=bold:size=9}MEMORY & STORAGE${font}
${color3}${hr 1}
${voffset 2}${color2}RAM${goto 85}${color1}${memperc}%${goto 140}${color5}${membar 5,180}
${goto 85}${color2}${mem} / ${memmax}
${voffset 2}${color2}SWAP${goto 85}${color1}${swapperc}%${goto 140}${color2}${swapbar 5,180}
${goto 85}${color2}${swap} / ${swapmax}
${voffset 2}${color2}ROOT (/)${goto 85}${color1}${fs_used_perc /}%${goto 140}${color4}${fs_bar 5,180 /}
${goto 85}${color2}${fs_used /} / ${fs_size /} (${fs_free /} free)

${voffset 4}${color0}${font Ubuntu Sans:weight=bold:size=9}NETWORK${font}
${color3}${hr 1}
${voffset 2}${color2}SPEED${goto 85}${color4}▲ ${upspeed}${goto 210}${color5}▼ ${downspeed}
${color2}TOTAL${goto 85}${color2}▲ ${totalup}${goto 210}${color2}▼ ${totaldown}

${voffset 4}${color0}${font Ubuntu Sans:weight=bold:size=9}TOP PROCESSES${font}
${color3}${hr 1}
${voffset 2}${color2}NAME${goto 175}PID${goto 240}CPU%${goto 290}MEM%
${color1}${top name 1}${goto 165}${color2}${top pid 1}${goto 240}${color0}${top cpu 1}${goto 290}${color2}${top mem 1}
${color1}${top name 2}${goto 165}${color2}${top pid 2}${goto 240}${color0}${top cpu 2}${goto 290}${color2}${top mem 2}
${color1}${top name 3}${goto 165}${color2}${top pid 3}${goto 240}${color0}${top cpu 3}${goto 290}${color2}${top mem 3}
${color1}${top name 4}${goto 165}${color2}${top pid 4}${goto 240}${color0}${top cpu 4}${goto 290}${color2}${top mem 4}
${color1}${top name 5}${goto 165}${color2}${top pid 5}${goto 240}${color0}${top cpu 5}${goto 290}${color2}${top mem 5}
]]
